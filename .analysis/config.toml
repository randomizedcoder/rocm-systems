# Per-project analysis configuration.
#
# Override tool behavior for specific projects.
# Projects not listed here use the defaults.

[defaults]
cpp_standard = "c++17"
exclude_patterns = ["third_party/", "build/", "build-*/", "_build/"]

# ── Projects with their own .clang-tidy ──────────────────────────

[projects.amdsmi]
clang_tidy_config = "projects/amdsmi/.clang-tidy"

[projects.rocm-smi-lib]
clang_tidy_config = "projects/rocm-smi-lib/.clang-tidy"

[projects.rocprofiler]
clang_tidy_config = "projects/rocprofiler/.clang-tidy"

[projects.rocprofiler-register]
clang_tidy_config = "projects/rocprofiler-register/.clang-tidy"

[projects.rocprofiler-sdk]
clang_tidy_config = "projects/rocprofiler-sdk/.clang-tidy"

[projects.rocprofiler-systems]
clang_tidy_config = "projects/rocprofiler-systems/.clang-tidy"

# ── Projects with special language settings ──────────────────────

[projects.perf-dkms]
cpp_standard = "c11"
languages = ["c"]
# Pure C project, no GPU deps -- good candidate for gcc-analyzer

[projects.kpack]
# Minimal deps -- good candidate for gcc-warnings and gcc-analyzer

# ── Excluded from analysis ───────────────────────────────────────

[projects.amdgpu-windows-interop]
exclude = true
reason = "External source of truth"
