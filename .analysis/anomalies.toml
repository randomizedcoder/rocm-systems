# ─── rccl/src : CUDACHECK macro wrapper (1 finding) ───
# rccl defines CUDACHECK in src/include/checks.h; it checks hipError_t
# and goto fail / return ncclUnhandledCudaError. Semgrep sees the raw
# hipMemcpy call and misses the wrapping macro.

[[anomaly]]
id = "rccl-src-cudacheck-wrapper-fp-memcpy"
tool = "semgrep"
check_id = "nix.store.hip-unchecked-memcpy"
file = "projects/rccl/src/**"
code_anchor = "CUDACHECK"
anchor_window = 2
status = "false-positive"
reason = "Call is wrapped in rccl's CUDACHECK macro (src/include/checks.h) which checks hipError_t and propagates via ncclResult_t."
reviewer = "das"
date = "2026-04-13"

