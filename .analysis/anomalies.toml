# Known static analysis anomalies for the rocm-systems codebase.
#
# Each [[anomaly]] entry documents a finding that has been reviewed.
# Matching uses: tool + check_id + file (exact or glob) + code_anchor
# (literal substring within +/-anchor_window lines of the reported line).
#
# Status values:
#   false-positive  -- reviewed, not a real issue (suppressed from reports)
#   needs-review    -- potentially real issue, flagged for maintainer review
#   confirmed-bug   -- verified real bug, tracked until fixed
#   wont-fix        -- real issue but accepted risk (suppressed from reports)
#
# Per-anomaly analysis docs (only for needs-review / confirmed-bug): .analysis/anomalies/<id>.md
# Workflow guide: .analysis/README.md

# ──────────────────────────────────────────────────────────────────────
# Issue #6 — Unchecked HIP API returns (semgrep hip-check rules)
# Scope: 65 production findings in projects/rccl and projects/rocshmem
# for hip-unchecked-{malloc,memcpy,launch}.
# Preliminary review: analysis-reports/critical/06-unchecked-hip-returns.md
# ──────────────────────────────────────────────────────────────────────

# ─── rccl/src : CUDACHECK macro wrapper (1 finding) ───
# rccl defines CUDACHECK in src/include/checks.h; it checks hipError_t
# and goto fail / return ncclUnhandledCudaError. Semgrep sees the raw
# hipMemcpy call and misses the wrapping macro.

[[anomaly]]
id = "rccl-src-cudacheck-wrapper-fp-memcpy"
tool = "semgrep"
check_id = "nix.store.hip-unchecked-memcpy"
file = "projects/rccl/src/**"
code_anchor = "CUDACHECK"
anchor_window = 2
status = "false-positive"
reason = "Call is wrapped in rccl's CUDACHECK macro (src/include/checks.h) which checks hipError_t and propagates via ncclResult_t."
reviewer = "das"
date = "2026-04-13"

