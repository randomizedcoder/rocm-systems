# ─── rccl/tools/ib-test : bare hipLaunchKernelGGL with deferred error check (2 findings) ───
# ib_test.cpp lines 360 and 520 launch kernels without an immediate
# error check, but errors surface via CUDACHECK(hipDeviceSynchronize())
# at lines 622 and 645 before results are consumed. Standard deferred-
# error pattern; not a real bug in this microbenchmark tool.

[[anomaly]]
id = "rccl-tools-ib-test-bare-launch-deferred-sync-fp"
tool = "semgrep"
check_id = "nix.store.hip-unchecked-launch"
file = "projects/rccl/tools/ib-test/ib_test.cpp"
code_anchor = "hipLaunchKernelGGL"
anchor_window = 2
status = "false-positive"
reason = "Bare kernel launch; launch errors surface via CUDACHECK(hipDeviceSynchronize()) later in the same test loop (lines 622, 645). Microbenchmark tool, not production library code."
reviewer = "das"
date = "2026-04-13"

