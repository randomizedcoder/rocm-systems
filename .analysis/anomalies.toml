# ─── strerror: glibc implementation is thread-safe via TLS (blanket FP) ───
# All 156 semgrep strerror findings are in error/diagnostic logging
# paths. ROCm targets glibc-based Linux exclusively. glibc implements
# strerror() using a thread-local buffer, making it de facto thread-safe
# on all supported platforms. Migrating 156 call sites to strerror_r
# would incur POSIX vs GNU signature conflicts with no practical benefit.

[[anomaly]]
id = "strerror-glibc-tls-thread-safe-fp"
tool = "semgrep"
check_id = "nix.store.strerror-thread-unsafe"
file = "**"
code_anchor = "strerror"
anchor_window = 2
status = "false-positive"
reason = "glibc (the only ROCm target) implements strerror() using a thread-local buffer; calls are de facto thread-safe. All findings are in error-logging paths where the worst case is a garbled log message, not data corruption. Per-call migration to strerror_r would conflict with POSIX/GNU signature divergence for no practical gain. See analysis-reports/critical/09-thread-unsafe-functions.md Part B."
reviewer = "das"
date = "2026-04-13"
